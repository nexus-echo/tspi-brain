# TSPI AI Platform — Production Docker Compose
#
# Services:
#   • tspi-db  — private PostgreSQL + pgvector
#   • tspi-api — private FastAPI AI engine
#   • tspi-mcp — public MCP server
#
# External:
#   • Ollama running remotely on the user's GPU/local machine via Tailscale
#
# No Supabase.
# No Ollama container.
# No host ports.

services:

  # ============================================================
  # TSPI DATABASE — PRIVATE
  # PostgreSQL + pgvector
  # ============================================================
  tspi-db:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: tspi
      POSTGRES_PASSWORD: ${TSPI_DB_PASSWORD:-tspi}
      POSTGRES_DB: tspi

    volumes:
      - tspi_pgdata:/var/lib/postgresql/data

    ports:
      - '15432:5432'

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tspi -d tspi"]
      interval: 5s
      timeout: 3s
      retries: 12

    restart: unless-stopped


  # ============================================================
  # TSPI AI BRAIN — PRIVATE
  # ============================================================
  tspi-api:
    build:
      context: ./apps/ai-engine

    environment:
      DATABASE_URL: postgresql+psycopg://tspi:${TSPI_DB_PASSWORD:-tspi}@tspi-db:5432/tspi
      # Knowledge Q&A (POST /ask) — override any of these in Coolify; defaults shown.
      KB_DOCS_DIR: ${KB_DOCS_DIR:-/app/knowledge-sources}
      KB_DOCS_GLOBS: ${KB_DOCS_GLOBS:-products/*.md,39-axes/axes/*.md,new_revised_docs/question_answers.txt}
      ASK_TOP_K: ${ASK_TOP_K:-8}
      ASK_LLM_BUDGET_S: ${ASK_LLM_BUDGET_S:-120}

    # Curated knowledge docs for POST /ask (read-only). Only the allow-listed sub-folders are
    # mounted — never patient-samples or chat exports. KB_DOCS_HOST_DIR = where the docs live on
    # the host (default: the repo checkout); they appear in the container under KB_DOCS_DIR.
    volumes:
      - ${KB_DOCS_HOST_DIR:-./knowledge-sources}/products:${KB_DOCS_DIR:-/app/knowledge-sources}/products:ro
      - ${KB_DOCS_HOST_DIR:-./knowledge-sources}/39-axes/axes:${KB_DOCS_DIR:-/app/knowledge-sources}/39-axes/axes:ro
      - ${KB_DOCS_HOST_DIR:-./knowledge-sources}/new_revised_docs/question_answers.txt:${KB_DOCS_DIR:-/app/knowledge-sources}/new_revised_docs/question_answers.txt:ro

    # ports:
    #   - "8000:8000"

    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    depends_on:
      tspi-db:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # TSPI MCP SERVER — PUBLIC
  # ============================================================
  tspi-mcp:
    build:
      context: ./apps/tspi-mcp

    environment:
      TSPI_ENGINE_URL: http://tspi-api:8000
      TSPI_MCP_TRANSPORT: streamable-http
      TSPI_MCP_PORT: "8080"

    # Other secrets/configuration should be configured in Coolify,
    # for example OAuth/authentication settings.

    # ports:
    #   - "8080:8080"

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8080), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    depends_on:
      tspi-api:
        condition: service_healthy

    restart: unless-stopped


# ============================================================
# PERSISTENT DATABASE STORAGE
# ============================================================
volumes:
  tspi_pgdata:
